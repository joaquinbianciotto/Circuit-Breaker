name: resilience-lab

services:
  external-api:
    build:
      context: .
      dockerfile: apps/external-api/Dockerfile
    init: true
    environment:
      NODE_ENV: production
      PORT: "3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    init: true
    environment:
      NODE_ENV: production
      PORT: "3001"
      EXTERNAL_API_URL: http://external-api:3002
    depends_on:
      external-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    init: true
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ && wget -q -O /dev/null http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
